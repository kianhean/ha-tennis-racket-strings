name: Release on merge

on:
  push:
    branches:
      - main
    paths:
      - custom_components/racket_tracker/manifest.json
  # A release created by hand (or a draft published later) gets its racket_tracker.zip from
  # the backfill step below, so HACS can install it and its downloads are counted.
  # Releases this workflow creates use GITHUB_TOKEN, which doesn't fire this trigger.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two runs never upload the same release's zip together.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release from manifest version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open("custom_components/racket_tracker/manifest.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The bundled Racqix list is what installs that can't download it search, so each release
      # carries the newest copy. A download Racqix refuses changes nothing (scripts/update_dataset.py
      # leaves the file alone) and keeps the step green: it mustn't hold up a release.
      # git archive reads HEAD, not the working tree, so a refreshed list is committed here
      # (in this job only, never pushed) for the zip to include it. The tag stays on main's commit.
      - name: Refresh the bundled racquet list
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          python scripts/update_dataset.py || echo "::notice::Couldn't refresh the bundled list; releasing as committed"
          if ! git diff --quiet -- custom_components/racket_tracker; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Refresh the bundled Racqix list for the release" -- custom_components/racket_tracker
            echo "::notice::Releasing with the refreshed list"
          fi

      # HACS installs this zip (hacs.json: zip_release + filename) instead of the source
      # archive, so GitHub counts every install and update: the README downloads badge.
      # Files sit at the zip's root; HACS extracts them into custom_components/racket_tracker.
      - name: Build HACS zip
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git archive --format=zip -o racket_tracker.zip "HEAD:custom_components/racket_tracker"
          unzip -l racket_tracker.zip | grep -q ' manifest.json$'

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: racket_tracker.zip
          fail_on_unmatched_files: true

      # With zip_release, HACS installs every version (including "Redownload" of an older
      # one) from its racket_tracker.zip, so give each release that predates the zip one built
      # from its own tag. Idempotent: releases that already have the asset are skipped.
      - name: Attach HACS zip to older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx racket_tracker.zip; then
              continue
            fi
            if ! git cat-file -e "$tag:custom_components/racket_tracker/manifest.json" 2>/dev/null; then
              echo "::warning::$tag has no custom_components/racket_tracker; skipped"
              continue
            fi
            git archive --format=zip -o /tmp/racket_tracker.zip "$tag:custom_components/racket_tracker"
            gh release upload "$tag" /tmp/racket_tracker.zip
            echo "Attached racket_tracker.zip to $tag"
          done
