          accept:
            - image/*

calibrate_tension:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: racket_tracker
    tension:
      required: true
      example: 46
      selector:
        number:
          min: 1
          max: 100
          step: 0.1
          mode: box
    date:
      required: false
      selector:
        date:
    tool:
      required: false
      example: "ERT 300"
      selector:
        text:

log_play:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: racket_tracker
    hours:
      required: true
      example: 1.5
      selector:
        number:
          min: 0.1
          max: 24
          step: 0.1
          mode: box
          unit_of_measurement: h
    date:
      required: false
      selector:
        date:
    session_type:
      required: false
      selector:
        select:
          options:
            - singles_match
            - doubles_match
            - practice
            - ball_machine
          translation_key: session_type
    surface:
      required: false
      selector:
        select:
          options:
            - hard
            - clay
            - grass
            - indoor
          translation_key: surface
    notes:
      required: false
      selector:
        text:

