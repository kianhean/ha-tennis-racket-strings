# A complete dashboard view for one racket.
# Dashboard → ✏️ Edit → ⋮ → Raw configuration editor, and paste under `views:`
# (or add a new view and paste its cards). Replace `pure_aero` with your racket's
# entity ID prefix (it's the racket name you entered, slugified).
# Needs the scripts from examples/scripts.yaml.

title: Rackets
path: rackets
icon: mdi:tennis
type: sections
max_columns: 3
sections:
  # ── Current setup ────────────────────────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: Pure Aero
        icon: mdi:tennis
      - type: picture-entity
        entity: image.pure_aero_photo
        show_name: false
        show_state: false
        aspect_ratio: "4:3"
      - type: tile
        entity: sensor.pure_aero_strings
        name: Strings
        grid_options: { columns: 12 }
      - type: tile
        entity: sensor.pure_aero_tension
        name: Tension
        grid_options: { columns: 6 }
      - type: tile
        entity: sensor.pure_aero_days_since_restring
        name: Strings age
        grid_options: { columns: 6 }
      - type: tile
        entity: sensor.pure_aero_last_restrung
        name: Last restrung
        grid_options: { columns: 6 }
      - type: tile
        entity: sensor.pure_aero_total_string_cost
        name: Total spent
        grid_options: { columns: 6 }
      # Needs "Hours of play per week" set on the racket (Configure → Play)
      - type: tile
        entity: sensor.pure_aero_estimated_tension
        name: Est. tension
        grid_options: { columns: 6 }
      - type: tile
        entity: sensor.pure_aero_estimated_tension_loss
        name: Est. tension loss
        grid_options: { columns: 6 }
      - type: button
        name: Log restring
        icon: mdi:plus-circle
        tap_action:
          action: more-info
        entity: script.log_restring
        grid_options: { columns: 4, rows: 2 }
      # Logs the usual setup (Configure → Usual setup) for today, in one tap
      - type: button
        name: Usual setup
        icon: mdi:repeat
        entity: button.pure_aero_restring_with_usual_setup
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.pure_aero_restring_with_usual_setup
          confirmation:
            text: Log a restring with the usual setup for today?
        grid_options: { columns: 4, rows: 2 }
      - type: button
        name: Rate strings
        icon: mdi:star
        tap_action:
          action: more-info
        entity: script.rate_current_strings
        grid_options: { columns: 4, rows: 2 }

  # ── Current string notes ─────────────────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: Current strings
      - type: markdown
        content: >
          {% set a = states.sensor.pure_aero_strings.attributes %}
          {% if a.main_string is defined %}
          **{{ states('sensor.pure_aero_strings') }}**
          @ {{ a.main_tension }}{% if a.cross_tension != a.main_tension %}/{{ a.cross_tension }}{% endif %}
          {{ state_attr('sensor.pure_aero_tension', 'unit_of_measurement') }}

          Strung {{ a.date }}{% if a.stringer %} by {{ a.stringer }}{% endif %}
          {% if a.cost is not none %} · {{ a.cost }} {{ state_attr('sensor.pure_aero_total_string_cost', 'unit_of_measurement') }}{% endif %}

          {% if a.rating %}{{ '⭐' * a.rating }}{% else %}_Not rated yet_{% endif %}

          {{ a.notes or '' }}
          {% else %}
          No restrings logged yet.
          {% endif %}
      - type: entities
        title: Specs
        # Only specs you entered (or that were looked up) exist; remove the rest.
        state_color: false
        entities:
          - entity: sensor.pure_aero_strung_weight
            name: Strung weight
          - entity: sensor.pure_aero_unstrung_weight
            name: Unstrung weight
          - entity: sensor.pure_aero_balance
            name: Balance
          - entity: sensor.pure_aero_swingweight
            name: Swingweight
          - entity: sensor.pure_aero_stiffness
            name: Stiffness
          - entity: sensor.pure_aero_recommended_tension_min
            name: Tension (min)
          - entity: sensor.pure_aero_recommended_tension_max
            name: Tension (max)
      - type: history-graph
        title: Tension over time
        hours_to_show: 8760
        entities:
          - entity: sensor.pure_aero_tension
            name: Strung
          - entity: sensor.pure_aero_estimated_tension
            name: Estimated

  # ── When to restring ─────────────────────────────────────────────
  # Needs a rule under Configure → Restring reminder
  - type: grid
    cards:
      - type: heading
        heading: Schedule
        icon: mdi:calendar-clock
      - type: tile
        entity: binary_sensor.pure_aero_restring_due
        name: Restring due
        grid_options: { columns: 6 }
      - type: tile
        entity: sensor.pure_aero_next_restring
        name: Next restring
        grid_options: { columns: 6 }
      # Restrings and the next restring due (also in the sidebar's Calendar)
      - type: calendar
        initial_view: dayGridMonth
        entities:
          - calendar.pure_aero_restrings
        grid_options: { columns: full, rows: 9 }

  # ── Full history with photos ─────────────────────────────────────
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Restring history
        grid_options: { columns: full }
      - type: markdown
        grid_options: { columns: full }
        # One table row per restring; "-" in {%- -%} keeps each row on one line.
        content: |
          {% set history = state_attr('sensor.pure_aero_restrings', 'history') or [] -%}
          {% set cur = state_attr('sensor.pure_aero_total_string_cost', 'unit_of_measurement') -%}
          {% if history | count == 0 -%}
          No restrings logged yet.
          {%- else -%}
          | Photo | Date | Strings | Tension | Cost | Rating | Notes |
          |:-:|---|---|---|--:|---|---|
          {% for r in history -%}
          | {% if r.image_url %}<a href="{{ r.image_url }}" target="_blank"><img src="{{ r.image_url }}" width="72"></a>{% endif -%}
          {{ ' | ' }}{{ r.date -}}
          {{ ' | ' }}{{ r.main_string }}{% if r.cross_string != r.main_string %} / {{ r.cross_string }}{% endif -%}
          {{ ' | ' }}{{ r.main_tension }}{% if r.cross_tension != r.main_tension %}/{{ r.cross_tension }}{% endif %} {{ r.tension_unit -}}
          {{ ' | ' }}{{ '%.0f' | format(r.cost) ~ ' ' ~ cur if r.cost is not none else '' -}}
          {{ ' | ' }}{{ '⭐' * r.rating if r.rating else '' -}}
          {{ ' | ' }}{{ (r.notes or '') | replace('\n', ' ') | replace('|', '/') }} |
          {% endfor -%}
          {% endif %}
